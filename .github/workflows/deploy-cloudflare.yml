name: Deploy to Cloudflare Workers

# CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID がリポジトリのSecretsに
# 登録されている場合のみデプロイする（未登録の間はスキップして成功扱い）
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check Cloudflare secrets
        id: check
        run: |
          echo "ok=${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.check.outputs.ok == 'true'

      - name: Prepare site
        if: steps.check.outputs.ok == 'true'
        run: |
          mkdir -p _site
          cp -r index.html assets _site/

      - name: Deploy to Cloudflare Workers
        if: steps.check.outputs.ok == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Secrets not configured (skipped)
        if: steps.check.outputs.ok != 'true'
        run: echo "CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID が未登録のためスキップしました。"
